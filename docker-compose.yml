services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: woonpoints
      POSTGRES_PASSWORD: ${WOONPOINTS_DB_PASSWORD:?Set a unique WOONPOINTS_DB_PASSWORD in .env before starting Compose}
      POSTGRES_DB: woonpoints
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - woonpoints_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woonpoints -d woonpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    env_file: .env
    # The launcher builds the canonical URL inside the child. Avoid publishing
    # a second plaintext password in the Compose-resolved service config.
    environment:
      DATABASE_URL: ""
    command: ["node", "src/lib/db-url-launcher.mjs", "npm", "run", "dev"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    # Override stale .env DATABASE_URL; no plaintext URL before the launcher.
    environment:
      DATABASE_URL: ""
    command: ["node", "src/lib/db-url-launcher.mjs", "npm", "run", "worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  woonpoints_db:
