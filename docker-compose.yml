services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: woonpoints
      POSTGRES_PASSWORD: woonpoints
      POSTGRES_DB: woonpoints
    ports:
      - "5432:5432"
    volumes:
      - woonpoints_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woonpoints -d woonpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  woonpoints_db:
