name: QA Woonpoints Account Authorization
on:
  pull_request:
    paths:
      - 'src/lib/safety.mjs'
      - 'tests/authorization-guard.test.mjs'
      - '.github/workflows/qa-account-authorization.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/safety.mjs'
      - 'tests/authorization-guard.test.mjs'
      - '.github/workflows/qa-account-authorization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert source is exact immutable triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/lib/safety.mjs && node --check tests/authorization-guard.test.mjs
      - run: node --test tests/*.test.mjs
