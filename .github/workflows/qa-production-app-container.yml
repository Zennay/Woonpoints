name: QA Woonpoints Production App Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - tests/docker-build-context.qa.test.mjs
      - docker-compose.yml
      - next.config.mjs
      - package.json
      - package-lock.json
      - src/app/**
      - src/lib/db-url-launcher.mjs
      - tests/docker-production-app.qa.test.mjs
      - .github/workflows/qa-production-app-container.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - tests/docker-build-context.qa.test.mjs
      - docker-compose.yml
      - next.config.mjs
      - package.json
      - package-lock.json
      - src/app/**
      - src/lib/db-url-launcher.mjs
      - tests/docker-production-app.qa.test.mjs
      - .github/workflows/qa-production-app-container.yml

permissions:
  contents: read

jobs:
  production-http:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 15
    env:
      XDG_RUNTIME_DIR: ${{ runner.temp }}/woonpoints-rootless-oci
    steps:
      - name: Checkout reviewed SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind validation to exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node --test tests/docker-production-app.qa.test.mjs
      - name: Require isolated unprivileged OCI build runtime
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v podman >/dev/null
          install -d -m 0700 "$XDG_RUNTIME_DIR"
          test "$(podman --cgroup-manager=cgroupfs info --format '{{.Host.Security.Rootless}}')" = true
      - name: Plant inert nested secret canaries to verify actual context exclusion
        run: |
          set -euo pipefail
          printf 'PRIVATE-SYNTHETIC-ONLY' > src/app/production-credentials.json
          printf 'PRIVATE-SYNTHETIC-ONLY' > src/lib/token.json
          printf 'PRIVATE-SYNTHETIC-ONLY' > prisma/backup.sql
      - name: Build production app in isolated rootless OCI
        run: |
          set -euo pipefail
          podman --cgroup-manager=cgroupfs build --target app -t woonpoints-app-qa:local .
      - name: Prove review-only source inclusion and canary exclusion in built image
        run: |
          set -euo pipefail
          podman --cgroup-manager=cgroupfs run --rm --network none --entrypoint node woonpoints-app-qa:local -e '
            const fs = require("node:fs");
            const rejected = [
              "/app/src/app/production-credentials.json",
              "/app/src/lib/token.json",
              "/app/prisma/backup.sql",
            ];
            const required = [
              "/app/src/app/page.tsx",
              "/app/src/lib/db-url-launcher.mjs",
              "/app/src/worker/index.mjs",
              "/app/prisma/schema.prisma",
            ];
            if (rejected.some(p => fs.existsSync(p)) ||
                required.some(p => !fs.existsSync(p))) process.exit(1);
          '
      - name: Launch unnetworked production server and prove real HTTP + privacy headers
        run: |
          set -euo pipefail
          cid="$(podman --cgroup-manager=cgroupfs run --network none -d --rm \
            -e NEXT_TELEMETRY_DISABLED=1 \
            -e WOONPOINTS_DB_PASSWORD=synthetic-offline-test-only \
            --entrypoint node woonpoints-app-qa:local \
            src/lib/db-url-launcher.mjs npm run start)"
          trap 'podman --cgroup-manager=cgroupfs rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          # Verify actual image runtime identity, not just Dockerfile text.
          test "$(podman --cgroup-manager=cgroupfs exec "$cid" node -p 'process.getuid()')" = "1000"
          podman --cgroup-manager=cgroupfs exec "$cid" node -e '
            (async () => {
              let lastError = "not ready";
              for (let attempt=0; attempt<60; attempt++) {
                try {
                  const root = await fetch("http://127.0.0.1:3000/", {signal: AbortSignal.timeout(1200)});
                  const absent = await fetch("http://127.0.0.1:3000/qa-missing-route", {signal: AbortSignal.timeout(1200)});
                  if (root.status !== 200 || absent.status !== 404) {
                    throw new Error("unexpected HTTP status");
                  }
                  for (const response of [root, absent]) {
                    if (response.headers.get("x-frame-options") !== "DENY" ||
                        response.headers.get("x-content-type-options") !== "nosniff" ||
                        response.headers.get("referrer-policy") !== "no-referrer") {
                      throw new Error("HTTP privacy headers missing");
                    }
                  }
                  console.log("PASS isolated built Next app 200/404 with privacy headers");
                  return;
                } catch (error) {
                  lastError = error.message;
                  await new Promise(resolve => setTimeout(resolve, 500));
                }
              }
              throw new Error("production app did not pass bounded HTTP smoke: " + lastError);
            })().catch(() => process.exit(1));
          '
