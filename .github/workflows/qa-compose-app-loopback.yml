name: QA Local-Only Dashboard Binding
on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'tests/compose-app-loopback.qa.mjs'
      - '.github/workflows/qa-compose-app-loopback.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'tests/compose-app-loopback.qa.mjs'
      - '.github/workflows/qa-compose-app-loopback.yml'
permissions:
  contents: read
jobs:
  isolated-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact clean checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/compose-app-loopback.qa.mjs
      - run: node --test tests/compose-app-loopback.qa.mjs
      - run: node --test tests/safety.test.mjs tests/authorization-guard.test.mjs
