name: QA Woonpoints Immutable Docker Dependencies

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - tests/docker-build-context.qa.test.mjs
      - package.json
      - package-lock.json
      - tests/docker-locked-install.qa.test.mjs
      - .github/workflows/qa-locked-container-build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - tests/docker-build-context.qa.test.mjs
      - package.json
      - package-lock.json
      - tests/docker-locked-install.qa.test.mjs
      - .github/workflows/qa-locked-container-build.yml

permissions:
  contents: read

jobs:
  build-and-dry-run:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source identity and clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Plant synthetic unreviewed worker/runtime context credentials
        run: |
          set -euo pipefail
          printf 'FICTIONAL-NO-SECRETS' > src/worker/service-account.json
          printf 'FICTIONAL-NO-SECRETS' > prisma/backup.sql
      - name: Build pinned Docker worker image without deployment
        run: |
          set -euo pipefail
          docker build --target worker --tag woonpoints-locked-qa:local .
      - name: Assert actual worker image omits unreviewed nested source files
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node woonpoints-locked-qa:local -e '
            const fs = require("node:fs");
            if (fs.existsSync("/app/src/worker/service-account.json") ||
                fs.existsSync("/app/prisma/backup.sql") ||
                !fs.existsSync("/app/src/worker/index.mjs") ||
                !fs.existsSync("/app/prisma/schema.prisma")) process.exit(1);
          '
      - name: Verify real isolated worker dry run and live refusal
        run: |
          set -euo pipefail
          uid="$(docker run --rm --network none --entrypoint node woonpoints-locked-qa:local -p 'process.getuid()')"
          test "$uid" = "1000"
          receipt="$(docker run --rm --network none -e BOT_DRY_RUN=true --entrypoint node woonpoints-locked-qa:local src/worker/index.mjs)"
          node -e 'const r=JSON.parse(process.argv[1]);if(r.mode!=="dry-run"||r.status!=="ready"||!r.action.includes("No live WoningNet reaction"))process.exit(1)' "$receipt"
          if docker run --rm --network none -e BOT_DRY_RUN=false --entrypoint node woonpoints-locked-qa:local src/worker/index.mjs >/dev/null 2>&1; then
            echo "unsafe live execution admitted" >&2
            exit 1
          fi
